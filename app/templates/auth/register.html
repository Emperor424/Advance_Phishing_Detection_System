{% extends "base.html" %}
{% block title %}Register — PhishGuard{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo">🛡️</div>
  <h1 class="auth-title">Create account</h1>
  <p class="auth-subtitle">Join PhishGuard to protect your inbox</p>
  <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="full_name">Full name</label>
      <input class="form-input" type="text" id="full_name" name="full_name"
             value="{{ full_name|default('') }}" placeholder="Your Name" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-input" type="email" id="email" name="email"
             value="{{ email|default('') }}" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrapper">
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Min 8 chars, 1 uppercase, 1 digit" required oninput="checkStrength(this.value)">
        <button type="button" class="toggle-pw" onclick="togglePassword('password')">👁</button>
      </div>
      <div class="pw-strength-bar"><div id="strength-bar" class="strength-fill"></div></div>
      <div id="strength-label" class="strength-label"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm password</label>
      <input class="form-input" type="password" id="confirm_password" name="confirm_password"
             placeholder="••••••••" required>
      <div id="match-msg" class="field-hint"></div>
    </div>
    <button class="btn btn-primary btn-full" type="submit">Create Account</button>
  </form>
  <p class="auth-link">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
