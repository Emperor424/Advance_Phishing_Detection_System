{% extends "base.html" %}
{% block title %}Reset Password — PhishGuard{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo">🛡️</div>
  <h1 class="auth-title">Set a new password</h1>
  <p class="auth-subtitle">Choose a new password for your account</p>
  <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="password">New password</label>
      <div class="input-wrapper">
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Min 8 chars, 1 uppercase, 1 digit" required oninput="checkStrength(this.value)">
        <button type="button" class="toggle-pw" onclick="togglePassword('password')">👁</button>
      </div>
      <div class="pw-strength-bar"><div id="strength-bar" class="strength-fill"></div></div>
      <div id="strength-label" class="strength-label"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm new password</label>
      <input class="form-input" type="password" id="confirm_password" name="confirm_password"
             placeholder="••••••••" required>
      <div id="match-msg" class="field-hint"></div>
    </div>
    <button class="btn btn-primary btn-full" type="submit">Reset Password</button>
  </form>
  <p class="auth-link"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</div>
{% endblock %}
