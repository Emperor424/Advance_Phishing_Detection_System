{% extends "base.html" %}
{% block title %}Forgot Password — PhishGuard{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo">🛡️</div>
  <h1 class="auth-title">Forgot password?</h1>
  <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
  <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-input" type="email" id="email" name="email"
             placeholder="you@example.com" required autofocus>
    </div>
    <button class="btn btn-primary btn-full" type="submit">Send Reset Link</button>
  </form>
  <p class="auth-link"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</div>
{% endblock %}
