{% extends "base.html" %}
{% block title %}Login — PhishGuard{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo">🛡️</div>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-subtitle">Sign in to PhishGuard</p>
  <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-input" type="email" id="email" name="email"
             value="{{ email|default('') }}" placeholder="you@example.com" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrapper">
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••••" required>
        <button type="button" class="toggle-pw" onclick="togglePassword('password')">👁</button>
      </div>
      <div class="field-hint" style="text-align:right;">
        <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
      </div>
    </div>
    <button class="btn btn-primary btn-full" type="submit">Sign In</button>
  </form>
  <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
